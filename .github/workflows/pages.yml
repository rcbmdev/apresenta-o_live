# Publica a pasta deck/ no GitHub Pages a cada push na main (o deck é estático, sem build).
name: Publicar deck no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # O Pages manda o navegador guardar CSS/JS por 10 min. Sem versão na URL, um navegador pode juntar o
      # index.html novo com o CSS antigo (ex.: slide novo sem estilo). Cada deploy ganha ?v=<commit>.
      # Só a cópia publicada muda: o deck/index.html do repositório continua abrindo offline via file://.
      - name: Versionar CSS, JS e imagens
        run: |
          V=${GITHUB_SHA::8}
          sed -i -E "s#(href|src)=\"((css|js|vendor|assets)/[^\"?]+)\"#\1=\"\2?v=$V\"#g" deck/index.html
          grep -c "?v=$V" deck/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: deck
      - id: deployment
        uses: actions/deploy-pages@v5
